services:
  - type: web
    name: heatsentinel-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_MODE
        value: live
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"