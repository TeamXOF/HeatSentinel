[project]
name = "heatsentinel-ai"
version = "1.0.0"
description = "Autonomous Hyperlocal Heat Response Intelligence Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "fastapi-cli>=0.0.32",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "shapely==2.1.2",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scipy==1.18.1",
    "pyproj==3.7.2",
    "scikit-learn==1.9.0",
    "slowapi==0.1.9",
    "jsonschema==4.24.0",
]

[tool.fastapi-cli]
app = "app.main:app"
